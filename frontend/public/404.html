<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="module">
      // Сохраняем оригинальный путь
      sessionStorage.setItem('redirect', window.location.pathname);
      // Редирект на главную с сохранением пути в query параметре
      const path = window.location.pathname;
      window.location.href = `/?redirect=${encodeURIComponent(path)}`;
    </script>
  </head>
  <body>
    <noscript>
      <h1>Redirecting...</h1>
      <p>If you are not redirected, <a href="/">click here</a>.</p>
    </noscript>
  </body>
</html>
