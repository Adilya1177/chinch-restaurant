<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Простой редирект на главную для SPA
    sessionStorage.redirect = location.pathname;
    window.location.href = '/';
  </script>
</head>
<body>
  <noscript>
    <h1>Redirecting...</h1>
    <p>If you are not redirected, <a href="/">click here</a>.</p>
  </noscript>
</body>
</html>
